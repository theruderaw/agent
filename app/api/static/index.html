<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a0a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

  #header { padding: 12px 16px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 12px; }
  #header h1 { font-size: 14px; font-weight: 600; }
  #state { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: #1a1a2e; color: #7aa2f7; font-family: monospace; }
  #state.running { color: #e0af68; }
  #state.done { color: #9ece6a; }
  #state.error { color: #f7768e; }
  #state.waiting { color: #bb9af7; }

  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #1a3a5c; color: #c0d8f8; }
  .msg.assistant { align-self: flex-start; background: #1a1a2e; color: #c8d8f0; }
  .msg.system { align-self: center; background: none; color: #555; font-size: 12px; font-style: italic; }
  .msg.error { align-self: center; background: #2e1a1a; color: #f7768e; font-size: 12px; }
  .msg.tool { align-self: flex-start; background: #1a2e1a; color: #9ece6a; font-size: 12px; font-family: monospace; }
  .msg.skill { align-self: center; background: #2e2a1a; color: #e0af68; font-size: 12px; font-family: monospace; }
  .msg.ask { align-self: flex-start; background: #2e1a2e; color: #bb9af7; font-size: 14px; font-weight: 500; }
  .msg.final { align-self: flex-start; background: #1a1a2e; color: #c8d8f0; font-size: 14px; border-left: 3px solid #9ece6a; }
  .msg.refused { align-self: center; background: #2e1a1a; color: #f7768e; font-size: 13px; }

  .action-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; opacity: 0.6; }

  #events-toggle { border-top: 1px solid #222; padding: 4px 16px; font-size: 11px; color: #555; cursor: pointer; user-select: none; }
  #events-toggle:hover { color: #7aa2f7; }
  #events { border-top: 1px solid #222; max-height: 150px; overflow-y: auto; padding: 8px 16px; font-size: 11px; font-family: monospace; color: #555; display: none; }
  #events.open { display: block; }
  .event { padding: 2px 0; }
  .event .type { color: #7aa2f7; }

  #input-area { padding: 12px 16px; border-top: 1px solid #222; display: flex; gap: 8px; align-items: flex-end; }
  #input { flex: 1; background: #111; border: 1px solid #333; border-radius: 6px; padding: 10px 12px; color: #e0e0e0; font-size: 14px; font-family: inherit; resize: none; outline: none; max-height: 120px; }
  #input:focus { border-color: #7aa2f7; }
  #input:disabled { opacity: 0.4; }
  #send { background: #7aa2f7; color: #0a0a0a; border: none; border-radius: 6px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  #send:hover { background: #89b4fa; }
  #send:disabled { opacity: 0.4; cursor: default; }
  #new-run { display: none; background: #9ece6a; color: #0a0a0a; border: none; border-radius: 6px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  #new-run:hover { background: #a9d87a; }
</style>
</head>
<body>

<div id="header">
  <h1>Agent</h1>
  <span id="state">connecting</span>
</div>

<div id="messages"></div>

<div id="events-toggle">events</div>
<div id="events"></div>

<div id="input-area">
  <textarea id="input" rows="1" placeholder="Send a message..." disabled></textarea>
  <button id="send" disabled>Send</button>
  <button id="new-run">New Run</button>
</div>

<script>
const API = '';
let runId = null;
let polling = null;
let lastEventCount = 0;

const messagesEl = document.getElementById('messages');
const eventsEl = document.getElementById('events');
const eventsToggle = document.getElementById('events-toggle');
const stateEl = document.getElementById('state');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const newRunBtn = document.getElementById('new-run');

function addMsg(text, type = 'assistant') {
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  if (type === 'ask') {
    div.innerHTML = '<div class="action-label">Agent asks</div>' + text;
  } else {
    div.textContent = text;
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addEvent(ev) {
  const div = document.createElement('div');
  div.className = 'event';
  div.innerHTML = `<span class="type">${ev.event_type}</span> ${JSON.stringify(ev.payload)}`;
  eventsEl.appendChild(div);
  eventsEl.scrollTop = eventsEl.scrollHeight;
}

function setState(s) {
  stateEl.textContent = s;
  stateEl.className = '';
  if (['model_call', 'tool_call', 'skill_requested', 'start'].includes(s)) stateEl.className = 'running';
  else if (['stop', 'final', 'refused'].includes(s)) stateEl.className = 'done';
  else if (['failed'].includes(s)) stateEl.className = 'error';
  else if (['waiting_for_user'].includes(s)) stateEl.className = 'waiting';
}

function setInputEnabled(enabled, focus = false) {
  input.disabled = !enabled;
  sendBtn.disabled = !enabled;
  if (focus && enabled) input.focus();
}

function showNewRun() {
  newRunBtn.style.display = 'inline-block';
  sendBtn.style.display = 'none';
}

function hideNewRun() {
  newRunBtn.style.display = 'none';
  sendBtn.style.display = 'inline-block';
}

async function api(method, path, body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || 'Request failed');
  }
  return res.json();
}

async function createRun() {
  hideNewRun();
  input.value = '';
  setInputEnabled(false);
  lastEventCount = 0;
  messagesEl.innerHTML = '';
  eventsEl.innerHTML = '';

  try {
    const run = await api('POST', '/runs', {});
    runId = run.run_id;
    setState(run.state);
    startPolling();
  } catch (e) {
    addMsg(`Failed to create run: ${e.message}`, 'error');
  }
}

async function pollEvents() {
  if (!runId) return;
  try {
    const data = await api('GET', `/runs/${runId}/events`);
    const newEvents = data.events.slice(lastEventCount);
    for (const ev of newEvents) {
      addEvent(ev);
      handleEvent(ev);
    }
    lastEventCount = data.events.length;

    const run = await api('GET', `/runs/${runId}`);
    setState(run.state);

    if (run.state === 'waiting_for_user') {
      if (input.disabled) setInputEnabled(true, true);
    } else if (['stop', 'failed'].includes(run.state)) {
      if (run.final_response) addMsg(run.final_response, 'final');
      if (run.error) addMsg(run.error, 'error');
      stopPolling();
      setInputEnabled(false);
      showNewRun();
    } else if (run.state === 'model_call') {
      setInputEnabled(false);
    }
  } catch (e) {
    // ignore poll errors
  }
}

function handleEvent(ev) {
  switch (ev.event_type) {
    case 'tool_result':
      addMsg(typeof ev.payload.result === 'object' ? JSON.stringify(ev.payload.result.data || ev.payload.result) : ev.payload.result, 'tool');
      break;
    case 'tool_failed':
      addMsg(ev.payload.error, 'tool');
      break;
    case 'skill_received':
      addMsg(`Skill loaded: ${ev.payload.skill}`, 'skill');
      break;
    case 'ask_user':
      addMsg(ev.payload.question, 'ask');
      break;
    case 'user_input':
      addMsg(ev.payload.input, 'user');
      break;
  }
}

function startPolling() {
  stopPolling();
  polling = setInterval(pollEvents, 500);
}

function stopPolling() {
  if (polling) { clearInterval(polling); polling = null; }
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || !runId) return;
  input.value = '';
  input.style.height = 'auto';
  setInputEnabled(false);

  try {
    await api('POST', `/runs/${runId}/input`, { input: text });
    startPolling();
  } catch (e) {
    addMsg(`Failed to send input: ${e.message}`, 'error');
    setInputEnabled(true, true);
  }
}

eventsToggle.addEventListener('click', () => {
  eventsEl.classList.toggle('open');
  eventsToggle.textContent = eventsEl.classList.contains('open') ? 'events \u25bc' : 'events \u25b6';
});

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

newRunBtn.addEventListener('click', createRun);

createRun();
</script>
</body>
</html>
