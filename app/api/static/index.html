<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent</title>
<style>
  :root {
    --bg: #09090b;
    --surface: #18181b;
    --border: #27272a;
    --text: #fafafa;
    --text-muted: #71717a;
    --blue: #3b82f6;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --purple: #a855f7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ────────────────────────────── */

  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  #state-badge {
    font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    padding: 3px 10px;
    border-radius: 9999px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    transition: color 0.2s, border-color 0.2s;
  }

  #state-badge.running  { color: var(--yellow); border-color: #713f12; }
  #state-badge.done     { color: var(--green);  border-color: #14532d; }
  #state-badge.error    { color: var(--red);    border-color: #7f1d1d; }
  #state-badge.waiting  { color: var(--purple); border-color: #581c87; }

  /* ── Chat area ─────────────────────────── */

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
  }

  .msg {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    animation: fadeIn 0.15s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    background: #1e3a5f;
    color: #bfdbfe;
    border-bottom-right-radius: 4px;
  }

  .msg.assistant {
    align-self: flex-start;
    background: var(--surface);
    color: #d4d4d8;
    border-bottom-left-radius: 4px;
  }

  .msg.ask {
    align-self: flex-start;
    background: #2e1065;
    color: #d8b4fe;
    border-bottom-left-radius: 4px;
  }

  .msg.final {
    align-self: flex-start;
    background: var(--surface);
    color: #d4d4d8;
    border-left: 3px solid var(--green);
  }

  .msg.refused {
    align-self: center;
    background: #450a0a;
    color: #fca5a5;
    font-size: 13px;
  }

  .msg.tool {
    align-self: flex-start;
    background: #052e16;
    color: #86efac;
    font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    max-width: 85%;
  }

  .msg.tool.error-tool {
    background: #450a0a;
    color: #fca5a5;
  }

  .msg.skill {
    align-self: center;
    background: #422006;
    color: #fde047;
    font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }

  .msg.system {
    align-self: center;
    color: var(--text-muted);
    font-size: 12px;
    font-style: italic;
    padding: 4px 0;
  }

  .msg.error-msg {
    align-self: center;
    background: #450a0a;
    color: #fca5a5;
    font-size: 12px;
  }

  .label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
    opacity: 0.5;
  }

  /* ── Typing indicator ──────────────────── */

  #typing {
    align-self: flex-start;
    padding: 10px 16px;
    display: none;
  }

  #typing.visible { display: flex; gap: 4px; align-items: center; }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: pulse 1.2s ease-in-out infinite;
  }

  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; }
    40% { opacity: 1; }
  }

  /* ── Events panel ──────────────────────── */

  #events-bar {
    border-top: 1px solid var(--border);
    padding: 6px 20px;
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: color 0.15s;
  }

  #events-bar:hover { color: var(--blue); }

  #events-panel {
    border-top: 1px solid var(--border);
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
    background: var(--surface);
  }

  #events-panel.open {
    max-height: 200px;
    overflow-y: auto;
  }

  #events-panel .ev {
    padding: 3px 20px;
    font-size: 11px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }

  #events-panel .ev:last-child { border-bottom: none; }

  #events-panel .ev-type {
    color: var(--blue);
    min-width: 110px;
    flex-shrink: 0;
  }

  #events-panel .ev-payload {
    color: #52525b;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── Input area ────────────────────────── */

  #input-area {
    padding: 12px 20px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  #input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    max-height: 140px;
    line-height: 1.5;
    transition: border-color 0.15s;
  }

  #input::placeholder { color: #52525b; }
  #input:focus { border-color: var(--blue); }
  #input:disabled { opacity: 0.35; cursor: default; }

  .btn {
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s, background 0.15s;
    line-height: 1;
  }

  .btn:disabled { opacity: 0.35; cursor: default; }

  #send-btn {
    background: var(--blue);
    color: white;
  }

  #send-btn:hover:not(:disabled) { background: #2563eb; }

  #new-run-btn {
    display: none;
    background: var(--green);
    color: #052e16;
  }

  #new-run-btn:hover:not(:disabled) { background: #16a34a; }

  /* ── Scrollbar ─────────────────────────── */

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #52525b; }
</style>
</head>
<body>

<header>
  <h1>Agent</h1>
  <span id="state-badge">idle</span>
</header>

<div id="chat">
  <div id="typing">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
</div>

<div id="events-bar">
  <span id="events-label">events</span>
  <span id="events-count"></span>
</div>
<div id="events-panel"></div>

<div id="input-area">
  <textarea id="input" rows="1" placeholder="Type a message..." disabled></textarea>
  <button id="send-btn" class="btn" disabled>Send</button>
  <button id="new-run-btn" class="btn">New Run</button>
</div>

<script>
(() => {
  // ── State ──────────────────────────────────
  let runId = null;
  let polling = null;
  let lastEventIdx = 0;
  let eventsOpen = false;
  let shownFinalFromRun = false;

  // ── DOM refs ───────────────────────────────
  const chat      = document.getElementById('chat');
  const typing    = document.getElementById('typing');
  const stateBadge = document.getElementById('state-badge');
  const input     = document.getElementById('input');
  const sendBtn   = document.getElementById('send-btn');
  const newRunBtn = document.getElementById('new-run-btn');
  const eventsBar = document.getElementById('events-bar');
  const eventsLbl = document.getElementById('events-label');
  const eventsCnt = document.getElementById('events-count');
  const eventsPanel = document.getElementById('events-panel');

  // ── Helpers ────────────────────────────────

  function $(sel) { return document.querySelector(sel); }

  function addMsg(text, type = 'assistant') {
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    if (type === 'ask') {
      div.innerHTML = `<div class="label">Agent asks</div>${escHtml(text)}`;
    } else if (type === 'tool') {
      div.textContent = text;
    } else {
      div.textContent = text;
    }
    chat.insertBefore(div, typing);
    chat.scrollTop = chat.scrollHeight;
  }

  function addSystem(text) {
    const div = document.createElement('div');
    div.className = 'msg system';
    div.textContent = text;
    chat.insertBefore(div, typing);
  }

  function showTyping() { typing.classList.add('visible'); chat.scrollTop = chat.scrollHeight; }
  function hideTyping() { typing.classList.remove('visible'); }

  function setState(s) {
    stateBadge.textContent = s;
    stateBadge.className = '';
    if (['model_call', 'tool_call', 'skill_requested', 'start'].includes(s))
      stateBadge.classList.add('running');
    else if (['stop', 'final', 'refused'].includes(s))
      stateBadge.classList.add('done');
    else if (s === 'failed')
      stateBadge.classList.add('error');
    else if (s === 'waiting_for_user')
      stateBadge.classList.add('waiting');
  }

  function setInput(enabled, focus = false) {
    input.disabled = !enabled;
    sendBtn.disabled = !enabled;
    if (focus && enabled) input.focus();
  }

  function showNewRun() {
    newRunBtn.style.display = 'inline-block';
    sendBtn.style.display = 'none';
  }

  function hideNewRun() {
    newRunBtn.style.display = 'none';
    sendBtn.style.display = 'inline-block';
  }

  function updateEventsCount(n) {
    eventsCnt.textContent = n > 0 ? `${n} events` : '';
  }

  function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ── API ────────────────────────────────────

  async function api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const res = await fetch(path, opts);
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || `${res.status}`);
    }
    return res.json();
  }

  // ── Run lifecycle ──────────────────────────

  async function createRun() {
    hideNewRun();
    input.value = '';
    input.style.height = 'auto';
    setInput(false);
    shownFinalFromRun = false;
    lastEventIdx = 0;
    chat.querySelectorAll('.msg').forEach(m => m.remove());
    eventsPanel.innerHTML = '';
    updateEventsCount(0);

    try {
      const run = await api('POST', '/runs', {});
      runId = run.run_id;
      setState(run.state);
      addSystem('Run created. Waiting for input...');
      startPolling();
    } catch (e) {
      addMsg(`Failed to create run: ${e.message}`, 'error-msg');
    }
  }

  // ── Polling ────────────────────────────────

  async function poll() {
    if (!runId) return;
    try {
      const [evData, run] = await Promise.all([
        api('GET', `/runs/${runId}/events`),
        api('GET', `/runs/${runId}`),
      ]);

      // Process new events
      const newEvents = evData.events.slice(lastEventIdx);
      for (const ev of newEvents) {
        appendEvent(ev);
        handleEvent(ev);
      }
      lastEventIdx = evData.events.length;
      updateEventsCount(lastEventIdx);

      // Update state
      setState(run.state);

      // State-based UI
      if (run.state === 'waiting_for_user') {
        hideTyping();
        if (input.disabled) setInput(true, true);
      } else if (run.state === 'model_call') {
        showTyping();
        setInput(false);
      } else if (['stop', 'final', 'refused'].includes(run.state)) {
        hideTyping();
        // Show final response from run object if not already shown via event
        if (!shownFinalFromRun) {
          if (run.final_response && run.state === 'final')
            addMsg(run.final_response, 'final');
          else if (run.final_response && run.state === 'refused')
            addMsg(run.final_response, 'refused');
          shownFinalFromRun = true;
        }
        stopPolling();
        setInput(false);
        showNewRun();
      } else if (run.state === 'failed') {
        hideTyping();
        if (run.error) addMsg(run.error, 'error-msg');
        stopPolling();
        setInput(false);
        showNewRun();
      }
    } catch {
      // silent — transient network issues
    }
  }

  function handleEvent(ev) {
    switch (ev.event_type) {
      case 'user_input':
        addMsg(ev.payload.input, 'user');
        break;

      case 'ask_user':
        addMsg(ev.payload.question, 'ask');
        break;

      case 'tool_result': {
        const data = ev.payload.result?.data ?? ev.payload.result;
        addMsg(typeof data === 'string' ? data : JSON.stringify(data, null, 2), 'tool');
        break;
      }

      case 'tool_failed':
        addMsg(ev.payload.error || 'Tool failed', 'tool error-tool');
        break;

      case 'skill_received':
        addMsg(`Skill loaded: ${ev.payload.skill}`, 'skill');
        break;

      case 'final':
        addMsg(ev.payload.content, 'final');
        shownFinalFromRun = true;
        break;

      case 'refused':
        addMsg(ev.payload.reason, 'refused');
        shownFinalFromRun = true;
        break;

      // model_input, model_output, skill_request, tool_call — events panel only
    }
  }

  function startPolling() {
    stopPolling();
    polling = setInterval(poll, 400);
  }

  function stopPolling() {
    if (polling) { clearInterval(polling); polling = null; }
  }

  // ── Events panel ───────────────────────────

  function appendEvent(ev) {
    const div = document.createElement('div');
    div.className = 'ev';
    const payload = JSON.stringify(ev.payload);
    div.innerHTML =
      `<span class="ev-type">${ev.event_type}</span>` +
      `<span class="ev-payload">${escHtml(payload)}</span>`;
    eventsPanel.appendChild(div);
    if (eventsOpen) eventsPanel.scrollTop = eventsPanel.scrollHeight;
  }

  eventsBar.addEventListener('click', () => {
    eventsOpen = !eventsOpen;
    eventsPanel.classList.toggle('open', eventsOpen);
    eventsLbl.textContent = eventsOpen ? 'events \u25bc' : 'events';
  });

  // ── Input ──────────────────────────────────

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || !runId) return;
    input.value = '';
    input.style.height = 'auto';
    setInput(false);
    hideTyping();

    try {
      await api('POST', `/runs/${runId}/input`, { input: text });
      startPolling();
    } catch (e) {
      addMsg(`Failed to send: ${e.message}`, 'error-msg');
      setInput(true, true);
    }
  }

  sendBtn.addEventListener('click', sendMessage);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  newRunBtn.addEventListener('click', createRun);

  // ── Boot ───────────────────────────────────
  createRun();
})();
</script>
</body>
</html>
